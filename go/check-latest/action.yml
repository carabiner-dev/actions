name: go-check-latest
author: carabiner-dev
description: >
  Checks that a project's go.mod references the latest stable Go release.
  Fails with an actionable error message if the version is outdated.

inputs:
  go-mod-path:
    description: 'Path to go.mod (default: go.mod in the repo root)'
    required: false
    default: 'go.mod'
  minor-cooloff-days:
    description: >-
      Days a new minor release (X.Y.0) must have been out before it is
      considered stable. Passed through to go/versions. Set to 0 to disable.
    required: false
    default: '5'
  patch-cooloff-days:
    description: >-
      Days a patch release (X.Y.Z, Z>0) must have been out before it is picked
      over the previous patch. Passed through to go/versions. Set to 0 to disable.
    required: false
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Resolve Go versions
      id: versions
      uses: carabiner-dev/actions/go/versions@d6d91c5c88723021a8798392cb9780c89ff6fdad # v1.2.7
      with:
        go-mod-path: ${{ inputs.go-mod-path }}
        minor-cooloff-days: ${{ inputs.minor-cooloff-days }}
        patch-cooloff-days: ${{ inputs.patch-cooloff-days }}

    - name: Check go.mod uses latest stable Go
      shell: bash
      run: |
        set -euo pipefail

        PROJECT="${STEPS_VERSIONS_OUTPUTS_GO_VERSION_PROJECT}"
        STABLE="${STEPS_VERSIONS_OUTPUTS_GO_VERSION_STABLE}"

        echo "Project go.mod version: ${PROJECT}"
        echo "Latest stable version:  ${STABLE}"

        if [ "$PROJECT" != "$STABLE" ]; then
          echo "::error::go.mod is using Go ${PROJECT} but the latest stable release is Go ${STABLE}. Please update go.mod to Go ${STABLE}."
          exit 1
        fi

        echo "go.mod is up to date with the latest stable Go release (${STABLE})."
      env:
        STEPS_VERSIONS_OUTPUTS_GO_VERSION_PROJECT: ${{ steps.versions.outputs.GO_VERSION_PROJECT }}
        STEPS_VERSIONS_OUTPUTS_GO_VERSION_STABLE: ${{ steps.versions.outputs.GO_VERSION_STABLE }}
