name: Test SLSA Generate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pull requests from forks get no OIDC token, so keyless signing can't run
  # there. Those runs sign with a throwaway key made for the run instead, and
  # the verify job checks the attestation against its public key.
  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

jobs:
  # Produce an artifact to be attested by the provenance action.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create a file to attest
        shell: bash
        run: echo "carabiner slsa/generate test artifact — run ${GITHUB_RUN_ID}" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifact
          path: artifact.txt

  # Observe the build job and generate a signed SLSA provenance attestation
  # covering its uploaded artifact, then publish the attestation as an artifact.
  provenance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Sigstore keyless signing
      contents: read
      actions: read     # Read run metadata and artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate a throwaway signing key
        id: key
        if: env.FORK_PR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/signing-key"
          mkdir -p "${dir}"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "${dir}/key.pem"
          openssl pkey -in "${dir}/key.pem" -pubout -out public-key.pem
          echo "private=${dir}/key.pem" >> "${GITHUB_OUTPUT}"

      - name: Generate provenance
        id: slsa
        uses: ./slsa/generate
        with:
          # Watch only the build job; watching the whole run would include the
          # verify job (which needs this one) and deadlock.
          watch-jobs: build
          # Empty outside fork PRs, which keeps keyless signing.
          signing-key: ${{ steps.key.outputs.private }}

      - name: Upload the signing public key
        if: env.FORK_PR == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-public-key
          path: public-key.pem

      - name: Upload provenance attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.slsa.outputs.attestation }}

  # Download the artifact and its provenance, then verify the attestation with
  # ampel: the subject must be covered by a SLSA provenance signed by this
  # workflow's Sigstore identity.
  verify:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-artifact
          path: subject

      - name: Download provenance attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: attestations

      - name: Verify artifact provenance with ampel
        if: env.FORK_PR != 'true'
        uses: ./ampel/verify
        with:
          subject: subject/artifact.txt
          collector: "fs:attestations"
          policy: "git+https://github.com/carabiner-dev/policies#slsa/has-attestation.json"
          signer: 'sigstore(regexp)::https://token\.actions\.githubusercontent\.com::https://github\.com/carabiner-dev/actions/\.github/workflows/test-slsa-generate\.yaml@refs/.+'
          attest: "false"

      - name: Download the signing public key
        if: env.FORK_PR == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-public-key
          path: signing-key

      # Fork PRs: the attestation must verify against the throwaway key the
      # provenance job signed with.
      - name: Verify artifact provenance with ampel (throwaway key)
        if: env.FORK_PR == 'true'
        uses: ./ampel/verify
        with:
          subject: subject/artifact.txt
          collector: "fs:attestations"
          policy: "git+https://github.com/carabiner-dev/policies#slsa/has-attestation.json"
          key: signing-key/public-key.pem
          attest: "false"
