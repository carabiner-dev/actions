name: Test Actions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-installers:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        tool: [ampel-bootstrap, ampel, bnd, beaker, revex, snappy, unpack, policyctl, vexflow]
        exclude:
          # beaker has no Windows binary
          - runner: windows-latest
            tool: beaker
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.tool == 'ampel-bootstrap'
        id: bootstrap
        uses: ./install/ampel-bootstrap
      - if: matrix.tool == 'ampel'
        uses: ./install/ampel
      - if: matrix.tool == 'bnd'
        uses: ./install/bnd
      - if: matrix.tool == 'beaker'
        uses: ./install/beaker
      - if: matrix.tool == 'revex'
        uses: ./install/revex
      - if: matrix.tool == 'snappy'
        uses: ./install/snappy
      - if: matrix.tool == 'unpack'
        uses: ./install/unpack
      - if: matrix.tool == 'policyctl'
        uses: ./install/policyctl
      - if: matrix.tool == 'vexflow'
        uses: ./install/vexflow

      - if: matrix.tool == 'ampel-bootstrap'
        name: Verify bootstrap binary runs
        shell: bash
        run: ${STEPS_BOOTSTRAP_OUTPUTS_AMPEL_PATH} version
        env:
          STEPS_BOOTSTRAP_OUTPUTS_AMPEL_PATH: ${{ steps.bootstrap.outputs.ampel-path }}

      - if: matrix.tool != 'ampel-bootstrap'
        name: Verify binary runs
        shell: bash
        run: ${{ matrix.tool }} --help

  test-download-and-verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify snappy
        uses: ./install/download-and-verify
        with:
          tool: snappy
          version: v0.2.4
          attestation-file: snappy-v0.2.4.provenance.json

      - name: Verify snappy is on PATH
        shell: bash
        run: snappy version

  test-ampel-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bnd binary as test subject
        shell: bash
        run: |
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/bnd \
            "https://github.com/carabiner-dev/bnd/releases/download/v0.4.1/bnd-v0.4.1-linux-amd64"

      - name: Verify bnd with ampel/verify
        uses: ./ampel/verify
        with:
          subject: /tmp/bnd
          collector: https://github.com/carabiner-dev/bnd/releases/download/v0.4.1/attestations.jsonl
          policy: "git+https://github.com/carabiner-dev/policies#slsa/has-attestation.json"
          attest: "false"

  test-snappy-snap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Snapshot the repository with snappy/snap
        id: snap
        uses: ./snappy/snap
        with:
          spec: builtin:github/repo.yaml
          vars: |
            ORG=${{ github.repository_owner }}
            REPO=${{ github.event.repository.name }}
          output: attestations/repo.bundle.json

      - name: Verify the signed bundle
        shell: bash
        env:
          ATTESTATION: ${{ steps.snap.outputs.attestation }}
        run: |
          test -s "${ATTESTATION}"
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "${ATTESTATION}"

  test-bnd-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attest the dependabot config to the commit with bnd/commit
        id: commit
        uses: ./bnd/commit
        with:
          path: .github/dependabot.yaml
          type: https://example.com/dependabot-config/v1
          output: attestations/dependabot.bundle.json

      - name: Verify the signed bundle attests HEAD
        shell: bash
        env:
          ATTESTATION: ${{ steps.commit.outputs.attestation }}
        run: |
          test -s "${ATTESTATION}"
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "${ATTESTATION}"
          HEAD_SHA="$(git rev-parse HEAD)"
          bnd extract statement "${ATTESTATION}" \
            | jq -e --arg sha "${HEAD_SHA}" \
                '.predicateType == "https://example.com/dependabot-config/v1" and .subject[0].digest.gitCommit == $sha and (.predicate.updates | length) > 0'

  test-bnd-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch release provenance bundles to pack
        shell: bash
        run: |
          mkdir -p bundles
          for spec in snappy:v0.2.6 unpack:v0.3.2 ampel:v1.3.7; do
            tool="${spec%%:*}"; version="${spec##*:}"
            curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
              -o "bundles/${tool}-${version}.provenance.json" \
              "https://github.com/carabiner-dev/${tool}/releases/download/${version}/${tool}-${version}.provenance.json"
          done
          # A jsonl input to merge, with no trailing newline on purpose.
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o bnd.attestations.jsonl \
            https://github.com/carabiner-dev/bnd/releases/download/v0.4.4/attestations.jsonl

      - name: Pack the bundles with bnd/pack
        id: pack
        uses: ./bnd/pack
        with:
          bundles: |
            bundles/
            bnd.attestations.jsonl
          output: out/attestations.jsonl

      - name: Verify the packed file
        shell: bash
        env:
          ATTESTATIONS: ${{ steps.pack.outputs.attestations }}
          COUNT: ${{ steps.pack.outputs.count }}
        run: |
          test "${COUNT}" = "4"
          test "$(wc -l < "${ATTESTATIONS}")" = "4"
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "${ATTESTATIONS}" | grep -c true | grep -qx 4
          bnd inspect "${ATTESTATIONS}" > /dev/null

  test-vexflow-assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This repository has no dependency manifests for vexflow to scan, so
      # assemble the document of a Go repository in the organization instead.
      - name: Resolve the commit to name as the product
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(gh api repos/carabiner-dev/bnd/commits/main --jq .sha)" >> "${GITHUB_OUTPUT}"

      - name: Assemble and sign the VEX document with vexflow/assemble
        id: assemble
        uses: ./vexflow/assemble
        with:
          repo: carabiner-dev/bnd
          branch: main
          product: sha1:${{ steps.target.outputs.sha }}
          output: attestations/openvex.bundle.json

      - name: Verify the signed bundle
        shell: bash
        env:
          ATTESTATION: ${{ steps.assemble.outputs.attestation }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          test -s "${ATTESTATION}"
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "${ATTESTATION}"
          bnd extract statement "${ATTESTATION}" \
            | jq -e --arg sha "${SHA}" \
                '.predicateType == "https://openvex.dev/ns/v0.2.0" and .subject[0].digest.sha1 == $sha and .predicate["@context"] == "https://openvex.dev/ns/v0.2.0"'
