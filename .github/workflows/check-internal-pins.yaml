name: Check Internal References

# The composite actions in this repository compose each other through the
# `$/` same-repository syntax, which resolves to this repository at the exact
# commit the caller is running. That keeps every internal reference in lockstep
# with the release it ships in, so no self-pins need bumping before a tag.
#
# This job guards the invariant: no action definition may reference
# carabiner-dev/actions by name again, since such a reference would pin an
# internal step to an unrelated (and inevitably stale) commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-internal-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check internal references
        shell: bash
        run: |
          set -euo pipefail

          HITS=$(
            grep -rnE "^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*['\"]?carabiner-dev/actions/" \
              --include=action.yml --include=action.yaml . || true
          )

          if [ -n "${HITS}" ]; then
            echo "::error::Internal references must use the \$/ same-repository syntax"
            echo "Replace 'uses: carabiner-dev/actions/<path>@<ref>' with 'uses: \$/<path>':"
            echo "${HITS}"
            exit 1
          fi

          echo "::notice::All internal references use the \$/ same-repository syntax"
