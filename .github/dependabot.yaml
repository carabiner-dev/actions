---
version: 2
updates:
  - package-ecosystem: "github-actions"  # zizmor: ignore[dependabot-cooldown] disabled for now
    directories:
      - "drop"
      - "install/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # The automation that keeps the shims of the moved actions current
      # also bumps every reference to them, all to the same release.
      - dependency-name: "policylabs/actions*"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
