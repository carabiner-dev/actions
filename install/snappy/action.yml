name: setup snappy
author: carabiner-dev
description: 'Installs the Carabiner snappy API snapshotter into the runner environment'
branding:
  icon: 'download-cloud'
  color: 'green'
inputs:
  install-dir:
    description: 'Path to install the binary'
    required: false
    default: '$HOME/.carabiner'
  version:
    description: 'snappy version to install'
    required: false
    default: 'v0.2.7'
runs:
  using: "composite"
  steps:
    - uses: $/install/download-and-verify
      with:
        tool: snappy
        version: ${{ inputs.version }}
        install-dir: ${{ inputs.install-dir }}
        # Releases from v0.2.7 ship every attestation in one file; earlier
        # ones carry the provenance on its own under the versioned name.
        attestation-file: |
          attestations.intoto.jsonl
          snappy-${{ inputs.version }}.provenance.json
