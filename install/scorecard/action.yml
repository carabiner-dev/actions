# [!] Temporary installer, do not depend on it.
#
# This installer exists only because ossf/scorecard-action cannot write its
# results as an in-toto statement yet, while the scorecard CLI can. It will
# be removed without a deprecation period as soon as the action supports the
# in-toto results format; use ossf/scorecard-action directly from then on.

name: setup scorecard
author: carabiner-dev
description: >
  [Temporary, do not depend on it] Installs the OpenSSF Scorecard CLI into the
  runner environment, verifying the release archive against its SLSA
  provenance. To be removed once ossf/scorecard-action can emit in-toto
  results.
branding:
  icon: 'download-cloud'
  color: 'green'
inputs:
  install-dir:
    description: 'Path to install the binary'
    required: false
    default: '$HOME/.carabiner'
  version:
    description: 'Scorecard version to install'
    required: false
    default: 'v5.5.0'
  verify:
    description: 'Verify the release archive with ampel against its SLSA provenance'
    required: false
    default: 'true'
  policy:
    description: >
      Ampel policy locator (VCS locator or path) applied when verifying the
      release archive. Defaults to a pinned revision of the carabiner-dev
      policies repo's slsa-build-point policy.
    required: false
    default: 'git+https://github.com/carabiner-dev/policies@eed2d09ac2a7f8f5238a24b30492e378d8d77ad3#slsa/slsa-build-point.json'
  build-point:
    description: >
      Source repository (VCS URI) the default policy expects the provenance
      to name as the build point.
    required: false
    default: 'git+https://github.com/ossf/scorecard'
runs:
  using: "composite"
  steps:
      - name: Validate install-dir
        id: install-dir
        shell: bash
        run: |
          case "$INPUTS_INSTALL_DIR" in
            ''|*[!A-Za-z0-9._/\$~-]*)
              echo "::error::install-dir must be non-empty and contain only [A-Za-z0-9._/\$~-]; got: $INPUTS_INSTALL_DIR"
              exit 1
              ;;
          esac
          # The value arrives through env, so the shell never expands a $HOME
          # or ~ prefix. So we resolve the path here and use it downstream.
          case "$INPUTS_INSTALL_DIR" in
            '$HOME'|'$HOME'/*) dir="${HOME}${INPUTS_INSTALL_DIR#\$HOME}" ;;
            '~'|'~'/*)         dir="${HOME}${INPUTS_INSTALL_DIR#\~}" ;;
            *)                 dir="$INPUTS_INSTALL_DIR" ;;
          esac
          echo "path=$dir" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_INSTALL_DIR: ${{ inputs.install-dir }}

      - name: Detect platform
        id: platform
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   os="linux" ;;
            macOS)   os="darwin" ;;
            Windows) os="windows" ;;
            *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
          esac

          case "$RUNNER_ARCH" in
            X64)   arch="amd64" ;;
            ARM64) arch="arm64" ;;
            *) echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
          esac

          ext=""
          if [ "$os" = "windows" ]; then
            ext=".exe"
          fi

          case "$INPUTS_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must be a release tag like v5.5.0; got: $INPUTS_VERSION"; exit 1 ;;
          esac

          # Release archives carry the version without its v prefix:
          # scorecard_5.5.0_linux_amd64.tar.gz
          {
            echo "archive=scorecard_${INPUTS_VERSION#v}_${os}_${arch}.tar.gz"
            echo "ext=${ext}"
          } >> "$GITHUB_OUTPUT"
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          INPUTS_VERSION: ${{ inputs.version }}

      # The archive lands next to where the binary goes, as the other
      # installers do; that path is known to work on every runner.
      - name: Download scorecard ${{ inputs.version }}
        shell: bash
        run: |
          mkdir -p "${INSTALL_DIR}/bin"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "${INSTALL_DIR}/bin/${ARCHIVE}" \
            "https://github.com/ossf/scorecard/releases/download/${INPUTS_VERSION}/${ARCHIVE}"
        env:
          INSTALL_DIR: ${{ steps.install-dir.outputs.path }}
          ARCHIVE: ${{ steps.platform.outputs.archive }}
          INPUTS_VERSION: ${{ inputs.version }}

      # The release archives are the subjects of the SLSA provenance the
      # scorecard release workflow publishes through slsa-github-generator,
      # so verify the archive before anything is extracted from it. The
      # signer is the generator's reusable workflow; the build point ties the
      # provenance to the scorecard repository.
      - name: Verify scorecard ${{ inputs.version }} archive
        if: inputs.verify == 'true'
        uses: carabiner-dev/actions/ampel/verify@d6d91c5c88723021a8798392cb9780c89ff6fdad # v1.2.7
        with:
          subject: ${{ steps.install-dir.outputs.path }}/bin/${{ steps.platform.outputs.archive }}
          collector: https://github.com/ossf/scorecard/releases/download/${{ inputs.version }}/multiple.intoto.jsonl
          policy: ${{ inputs.policy }}
          signer: 'sigstore(regexp)::https://token\.actions\.githubusercontent\.com::https://github\.com/slsa-framework/slsa-github-generator/\.github/workflows/generator_generic_slsa3\.yml@refs/tags/v[0-9.]+'
          context: buildPoint:${{ inputs.build-point }}
          attest: 'false'
          results: none

      - name: Install scorecard
        shell: bash
        run: |
          tar -xzf "${INSTALL_DIR}/bin/${ARCHIVE}" -C "${INSTALL_DIR}/bin" "scorecard${EXT}"
          chmod 0755 "${INSTALL_DIR}/bin/scorecard${EXT}"
          rm -f "${INSTALL_DIR}/bin/${ARCHIVE}"
        env:
          INSTALL_DIR: ${{ steps.install-dir.outputs.path }}
          ARCHIVE: ${{ steps.platform.outputs.archive }}
          EXT: ${{ steps.platform.outputs.ext }}

      - if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: echo "${INSTALL_DIR}/bin" >> $GITHUB_PATH # zizmor: ignore[github-env] install-dir validated upstream
        shell: bash
        env:
          INSTALL_DIR: ${{ steps.install-dir.outputs.path }}
      - if: ${{ runner.os == 'Windows' }}
        # Resolve $HOME/~ with pwsh's own $HOME so PATH gets a Windows-style path.
        run: | # zizmor: ignore[github-env] install-dir validated upstream
          $dir = $env:INPUTS_INSTALL_DIR
          if ($dir -eq '$HOME' -or $dir.StartsWith('$HOME/')) { $dir = $HOME + $dir.Substring(5) }
          elseif ($dir -eq '~' -or $dir.StartsWith('~/')) { $dir = $HOME + $dir.Substring(1) }
          echo "$dir/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
        env:
          INPUTS_INSTALL_DIR: ${{ inputs.install-dir }}

      - shell: bash
        run: scorecard version
