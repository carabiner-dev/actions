name: setup vexflow
author: carabiner-dev
description: 'Installs the Vexflow VEX lifecycle manager into the runner environment'
branding:
  icon: 'download-cloud'
  color: 'green'
inputs:
  install-dir:
    description: 'Path to install the binary'
    required: false
    default: '$HOME/.carabiner'
  version:
    description: 'Vexflow version to install'
    required: false
    default: 'v0.0.4'
runs:
  using: "composite"
  steps:
    - uses: $/install/download-and-verify
      with:
        tool: vexflow
        version: ${{ inputs.version }}
        # vexflow moved to openvex: newer releases are built and signed
        # there, while v0.0.1 and earlier were built in carabiner-dev.
        orgs: 'openvex carabiner-dev'
        install-dir: ${{ inputs.install-dir }}
        attestation-file: vexflow-${{ inputs.version }}.provenance.json
